<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{email_title}}</title></head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#303044;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{email_preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#fff;border-radius:18px;"><tr><td align="center" style="padding:36px 32px;">
<img src="{{email_logo_url}}" alt="{{app_name}}" style="max-width:180px;max-height:50px;"><h1>{{email_heading}}</h1><p>Hola {{recipient_name}}, tenemos novedades para ti.</p>
<div style="padding:24px;text-align:left;background:#f8f9fb;line-height:1.7;">{{{email_body_html}}}</div>
<p style="color:#7e8299;">{{email_footer}}</p></td></tr></table></body></html>
