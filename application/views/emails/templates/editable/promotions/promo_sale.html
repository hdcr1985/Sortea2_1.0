<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{email_title}}</title></head>
<body style="margin:0;padding:24px;background:#fff6ef;font-family:Arial,Helvetica,sans-serif;color:#303044;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{email_preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#fff;border-radius:12px;overflow:hidden;"><tr><td align="center" style="padding:32px;background:#d95d39;color:#fff;">
<img src="{{email_logo_url}}" alt="{{app_name}}" style="max-width:170px;max-height:48px;"><p style="font-size:13px;letter-spacing:2px;">{{app_name}}</p><h1 style="font-size:30px;">{{email_heading}}</h1><p>Hola {{recipient_name}}, esta oferta es para ti.</p></td></tr>
<tr><td style="padding:30px;line-height:1.7;">{{{email_body_html}}}</td></tr><tr><td align="center" style="padding:20px;background:#fff6ef;color:#77564b;">{{email_footer}}</td></tr></table></body></html>
