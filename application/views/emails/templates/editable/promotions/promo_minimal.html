<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{email_title}}</title></head>
<body style="margin:0;padding:24px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#303044;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{email_preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;"><tr><td style="padding:24px;border-bottom:2px solid #e8edf2;">
<img src="{{email_logo_url}}" alt="{{app_name}}" style="max-width:150px;max-height:45px;"><p style="color:#728096;">{{app_name}}</p><h1>{{email_heading}}</h1><p>Hola {{recipient_name}},</p></td></tr>
<tr><td style="padding:24px;line-height:1.8;">{{{email_body_html}}}</td></tr><tr><td style="padding:24px;color:#728096;border-top:1px solid #e8edf2;">{{email_footer}}</td></tr></table></body></html>
