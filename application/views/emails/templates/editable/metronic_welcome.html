<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{email_title}}</title></head>
<body style="margin:0;padding:24px;background:#f5f8fa;font-family:Arial,Helvetica,sans-serif;color:#181c32;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{email_preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#fff;border-radius:16px;"><tr><td align="center" style="padding:36px;">
<img src="{{email_logo_url}}" alt="{{app_name}}" style="max-width:180px;max-height:50px;"><h1>{{email_heading}}</h1><p>Hola {{recipient_name}},</p>
{{{intro_lines_html}}}<table role="presentation" width="100%" cellspacing="0" cellpadding="0">{{{steps_html}}}</table>
<p style="margin:28px;"><a href="{{action_url}}" style="background:#0b7285;color:#fff;padding:13px 22px;text-decoration:none;border-radius:6px;">{{action_label}}</a></p>
<p style="color:#7e8299;">{{email_help_text}}</p><p style="color:#7e8299;">{{email_footer}}</p>
</td></tr></table></body></html>
